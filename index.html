<!DOCTYPE html>

<head>

<style>
* {

}

body {

}

header {

.container {

.card {

h2 {

label {

  margin-top: 12px;

}

input {

  padding: 11px;

button {

button:disabled {

.ai {

.secondary {

.delete-btn {

}

.complete-btn {

  background: #167148;

.completed-btn {

.hidden {

.status {

.hint {

.summary {

.edit-banner {

}

.result-grid img {

.table-wrap {

}

table {
  width: 100%;

}

th,
td {
  border: 1px solid #ccd3d9;

  text-align: center;
}

th {

}

.section-head {

}

.position-cell {

  font-weight: 700;
  background: #f3f5f7;
}

.matrix-input {

}

.review-cell {

.matrix-controls {

.result-title {

.record-card {

  margin-top: 10px;

}

.record-card.completed {

}

.record-card.incomplete {

}

.record-title {

</style>

<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
  "https://dcxplqljfadjrqyvpvoy.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_1XT8EGC8iNLtrFRMhqN41w_kLvgEKcR";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


let editingId =
  null;

let currentViewedRecord =
  null;

let existingPaths =
  [];

let existingPreviewUrls =
  [];

let rowMap =
  new Map();

let sectionCount =
  1;

let maxPosition =
  1;

let analysisMeta = {
  notes: "",
  ai_analyzed: false
};


const app =
  document.getElementById(
    "app"
  );

const loadingScreen =
  document.getElementById(
    "loadingScreen"
  );

const photosInput =
  document.getElementById(
    "photos"
  );


function localToday() {

  const d =
    new Date();

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );

  return `${y}-${m}-${day}`;
}


function formatDateTime(
  value
) {

  if (!value) {
    return "-";
  }

  const d =
    new Date(value);

  return d.toLocaleString(
    "ko-KR",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function showApp() {

  loadingScreen.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );
}


function setTab(
  mode
) {

  const registerTab =
    document.getElementById(
      "registerTab"
    );

  const searchTab =
    document.getElementById(
      "searchTab"
    );

  const listTab =
    document.getElementById(
      "listTab"
    );


  const registerSection =
    document.getElementById(
      "registerSection"
    );

  const searchSection =
    document.getElementById(
      "searchSection"
    );

  const listSection =
    document.getElementById(
      "listSection"
    );


  [
    registerTab,
    searchTab,
    listTab
  ].forEach(
    btn =>
      btn.classList.remove(
        "active"
      )
  );


  [
    registerSection,
    searchSection,
    listSection
  ].forEach(
    section =>
      section.classList.add(
        "hidden"
      )
  );


  if (
    mode === "register"
  ) {

    registerTab.classList.add(
      "active"
    );

    registerSection.classList.remove(
      "hidden"
    );

  } else if (
    mode === "search"
  ) {

    searchTab.classList.add(
      "active"
    );

    searchSection.classList.remove(
      "hidden"
    );

  } else {

    listTab.classList.add(
      "active"
    );

    listSection.classList.remove(
      "hidden"
    );

    loadRecordList();
  }
}


function rowKey(
  section,
  position
) {

  return `${section}-${position}`;
}


function getRow(
  section,
  position
) {

  const key =
    rowKey(
      section,
      position
    );


  if (
    !rowMap.has(
      key
    )
  ) {

    rowMap.set(
      key,
      {
        section,
        position,
        left: "",
        right: "",
        confidence: 1,
        needs_review: false
      }
    );
  }


  return rowMap.get(
    key
  );
}


function setRows(
  rows = [],
  suppliedSections = 0
) {

  rowMap =
    new Map();


  let detectedSection =
    0;

  let detectedPosition =
    0;


  rows.forEach(
    raw => {

      const section =
        Number(
          raw.section || 1
        );

      const position =
        Number(
          raw.position || 1
        );


      detectedSection =
        Math.max(
          detectedSection,
          section
        );

      detectedPosition =
        Math.max(
          detectedPosition,
          position
        );


      rowMap.set(
        rowKey(
          section,
          position
        ),
        {
          section,
          position,
          left:
            raw.left || "",
          right:
            raw.right || "",
          confidence:
            Number(
              raw.confidence ?? 1
            ),
          needs_review:
            Boolean(
              raw.needs_review
            )
        }
      );
    }
  );


  sectionCount =
    Math.max(
      1,
      Number(
        suppliedSections || 0
      ),
      detectedSection
    );


  maxPosition =
    Math.max(
      1,
      detectedPosition
    );


  renderEditableMatrix();
}


function collectRows() {

  return [
    ...rowMap.values()
  ]
  .filter(
    row =>
      String(
        row.left || ""
      ).trim() ||
      String(
        row.right || ""
      ).trim()
  )
  .map(
    row => ({
      section:
        Number(
          row.section
        ),

      position:
        Number(
          row.position
        ),

      left:
        String(
          row.left || ""
        ).trim(),

      right:
        String(
          row.right || ""
        ).trim(),

      confidence:
        Number(
          row.confidence ?? 1
        ),

      needs_review:
        Boolean(
          row.needs_review
        )
    })
  )
  .sort(
    (a, b) =>
      a.section - b.section ||
      a.position - b.position
  );
}


function renderEditableMatrix() {

  const wrap =
    document.getElementById(
      "matrixWrap"
    );


  wrap.innerHTML =
    "";


  const table =
    document.createElement(
      "table"
    );


  const thead =
    document.createElement(
      "thead"
    );


  const head1 =
    document.createElement(
      "tr"
    );


  const positionHead =
    document.createElement(
      "th"
    );


  positionHead.textContent =
    "위치";

  positionHead.rowSpan =
    2;


  head1.appendChild(
    positionHead
  );


  for (
    let section = 1;
    section <= sectionCount;
    section++
  ) {

    const th =
      document.createElement(
        "th"
      );


    th.textContent =
      `구역 ${section}`;

    th.colSpan =
      2;

    th.className =
      "section-head";


    head1.appendChild(
      th
    );
  }


  const head2 =
    document.createElement(
      "tr"
    );


  for (
    let section = 1;
    section <= sectionCount;
    section++
  ) {

    const left =
      document.createElement(
        "th"
      );

    left.textContent =
      "좌";


    const right =
      document.createElement(
        "th"
      );

    right.textContent =
      "우";


    head2.appendChild(
      left
    );

    head2.appendChild(
      right
    );
  }


  thead.appendChild(
    head1
  );

  thead.appendChild(
    head2
  );

  table.appendChild(
    thead
  );


  const tbody =
    document.createElement(
      "tbody"
    );


  for (
    let position = 1;
    position <= maxPosition;
    position++
  ) {

    const tr =
      document.createElement(
        "tr"
      );


    const posTd =
      document.createElement(
        "td"
      );


    posTd.textContent =
      position;

    posTd.className =
      "position-cell";


    tr.appendChild(
      posTd
    );


    for (
      let section = 1;
      section <= sectionCount;
      section++
    ) {

      const row =
        getRow(
          section,
          position
        );


      [
        "left",
        "right"
      ].forEach(
        side => {

          const td =
            document.createElement(
              "td"
            );


          if (
            row.needs_review ||
            Number(
              row.confidence
            ) < 0.8
          ) {

            td.classList.add(
              "review-cell"
            );
          }


          const input =
            document.createElement(
              "input"
            );


          input.className =
            "matrix-input";

          input.value =
            row[side] || "";

          input.placeholder =
            "-";


          input.addEventListener(
            "input",
            () => {

              row[side] =
                input.value;

              row.needs_review =
                false;

              row.confidence =
                1;


              td.classList.remove(
                "review-cell"
              );
            }
          );


          td.appendChild(
            input
          );

          tr.appendChild(
            td
          );
        }
      );
    }


    tbody.appendChild(
      tr
    );
  }


  table.appendChild(
    tbody
  );

  wrap.appendChild(
    table
  );
}


async function signedUrls(
  paths
) {

  const urls =
    [];


  for (
    const path of paths
  ) {

    const {
      data,
      error
    } =
    await supabase.storage
      .from(
        "bhd-images"
      )
      .createSignedUrl(
        path,
        3600
      );


    if (
      !error &&
      data?.signedUrl
    ) {

      urls.push(
        data.signedUrl
      );
    }
  }


  return urls;
}

      item.appendChild(

      );

  [
    ...photosInput.files
  ].forEach(

      const item =

        );


      item.className =
        "preview-item";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        URL.createObjectURL(

        );


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "preview-label";

      label.textContent =
        `추가 사진 ${i + 1}`;


      item.appendChild(
        img
      );

      item.appendChild(
        label
      );

      grid.appendChild(
        item
      );
    }
  );
}


async function compressForAI(
  file,
  maxDimension = 1800,
  quality = 0.82
) {

  const bitmap =
    await createImageBitmap(
      file
    );


  const ratio =
    Math.min(
      1,
      maxDimension /
      Math.max(
        bitmap.width,
        bitmap.height
      )
    );


  const width =
    Math.round(
      bitmap.width *
      ratio
    );

  const height =
    Math.round(
      bitmap.height *
      ratio
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  canvas
    .getContext(
      "2d"
    )
    .drawImage(
      bitmap,
      0,
      0,
      width,
      height
    );


  bitmap.close();


  return canvas.toDataURL(
    "image/jpeg",
    quality
  );
}

function safePart(
  value
) {

  return value.replace(
    /[^a-zA-Z0-9가-힣_.-]/g,
    "_"
  );
}


async function uploadNewFiles(
  shipNo,
  name
) {

  const files =
    [
      ...photosInput.files
    ];


  const paths =
    [];


  const time =
    Date.now();


  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const file =
      files[i];


    const path =
      `${safePart(shipNo)}/` +
      `${safePart(name)}/` +
      `${time}-${i + 1}-` +
      `${safePart(file.name)}`;


    const {
      error
    } =
    await supabase.storage
      .from(
        "bhd-images"
      )
      .upload(
        path,
        file
      );


    if (error) {
      throw error;
    }


    paths.push(
      path
    );
  }


  return paths;
}

function renderMirroredMatrix(
  rows,
  sections
) {

  const wrap =
    document.getElementById(
      "resultMatrix"
    );


  wrap.innerHTML =
    "";


  const map =
    new Map();


  let maxPos =
    1;


  rows.forEach(
    row => {

      const section =
        Number(
          row.section ||
          1
        );


      const position =
        Number(
          row.position ||
          1
        );


      maxPos =
        Math.max(
          maxPos,
          position
        );


      map.set(
        rowKey(
          section,
          position
        ),
        row
      );
    }
  );


  const table =
    document.createElement(
      "table"
    );


  let html =
    `
    <thead>
      <tr>
        <th rowspan="2">
          위치
        </th>
    `;


  for (
    let s = 1;
    s <= sections;
    s++
  ) {

    html +=
      `<th colspan="2">구역 ${s}</th>`;
  }


  html +=
    `
      </tr>
      <tr>
    `;


  for (
    let s = 1;
    s <= sections;
    s++
  ) {

    html +=
      `<th>좌</th><th>우</th>`;
  }


  html +=
    `
      </tr>
    </thead>
    <tbody>
    `;


  for (
    let p = 1;
    p <= maxPos;
    p++
  ) {

    html +=
      `<tr>
        <td class="position-cell">
          ${p}
        </td>
      `;


    for (
      let displaySection = 1;
      displaySection <= sections;
      displaySection++
    ) {

      const sourceSection =
        sections -
        displaySection +
        1;


      const source =
        map.get(
          rowKey(
            sourceSection,
            p
          )
        );


      html +=
        `<td>${source?.right || ""}</td>` +
        `<td>${source?.left || ""}</td>`;
    }


    html +=
      `</tr>`;
  }


  html +=
    `</tbody>`;


  table.innerHTML =
    html;


  wrap.appendChild(
    table
  );
}

) {

  const ok =
    confirm(
      `${record.ship_no || ""} / ${record.bhd_no || ""}\n\n` +

      `삭제 후에는 복구할 수 없습니다.`

    return;
  }


  try {

    const {
      error: deleteError
    } =
    await supabase
      .from(
        "bhd_records"
      )
      .delete()
      .eq(
        "id",
        record.id
      );


    if (
      deleteError
    ) {

async function searchRecords() {

  const ship =
    document.getElementById(
      "searchShip"
    ).value.trim();


  const area =
    document.getElementById(
      "searchArea"
    ).value.trim();


  const name =
    document.getElementById(
      "searchBhd"
    ).value.trim();


  const status =
    document.getElementById(
      "searchStatus"
    );


  const results =
    document.getElementById(
      "searchResults"
    );


  results.innerHTML =
    "";


  document.getElementById(
    "resultBox"
  ).classList.add(
    "hidden"
  );


  if (
    !ship &&
    !area &&
    !name
  ) {

    status.textContent =
      "호선, 위치, 이름 중 하나 이상 입력하세요.";

    return;
  }


  status.textContent =
    "검색 중...";


  let query =
    supabase
      .from(
        "bhd_records"
      )
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (
    ship
  ) {

    query =
      query.ilike(
        "ship_no",
        `%${ship}%`
      );
  }


  if (
    area
  ) {

    query =
      query.ilike(
        "area",
        `%${area}%`
      );
  }


  if (
    name
  ) {

    query =
      query.ilike(
        "bhd_no",
        `%${name}%`
      );
  }


  const {
    data,
    error
  } =
  await query;


  if (
    error
  ) {

    status.textContent =
      "조회 오류: " +
      error.message;

    return;
  }


  if (
    !data?.length
  ) {

    status.textContent =
      "조건에 맞는 등록 자료가 없습니다.";

    return;
  }


  const incompleteCount =
    data.filter(
      x =>
        !x.is_completed
    ).length;


  const completedCount =
    data.filter(
      x =>
        x.is_completed
    ).length;


  status.textContent =
    `${data.length}건 검색됨` +
    ` · 미완료 ${incompleteCount}건` +
    ` · 완료 ${completedCount}건`;


  data.forEach(
    record => {

      results.appendChild(
        recordCard(
          record,
          false
        )
      );
    }
  );
}


document.getElementById(
  "searchBtn"
).onclick =
  searchRecords;


[
  "searchShip",
  "searchArea",
  "searchBhd"
].forEach(
  id => {

    document
      .getElementById(
        id
      )
      .addEventListener(
        "keydown",
        e => {

          if (
            e.key === "Enter"
          ) {

            searchRecords();
          }
        }
      );
  }
);


async function loadRecordList() {

  const container =
    document.getElementById(
      "recordList"
    );


  const status =
    document.getElementById(
      "listStatus"
    );


  container.innerHTML =
    "";


  status.textContent =
    "목록 불러오는 중...";


  const {
    data,
    error
  } =
  await supabase
    .from(
      "bhd_records"
    )
    .select("*")
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (
    error
  ) {

    status.textContent =
      "목록 조회 실패: " +
      error.message;

    return;
  }


  if (
    !data?.length
  ) {

    status.textContent =
      "";


    container.innerHTML =
      `
      <div class="empty">
        등록된 BHD가 없습니다.
      </div>
      `;

    return;
  }


  const incompleteCount =
    data.filter(
      x =>
        !x.is_completed
    ).length;


  const completedCount =
    data.filter(
      x =>
        x.is_completed
    ).length;


  status.textContent =
    `전체 ${data.length}건` +
    ` · 미완료 ${incompleteCount}건` +
    ` · 완료 ${completedCount}건`;


  data.forEach(
    record => {

      container.appendChild(
        recordCard(
          record,
          true
        )
      );
    }
  );
}


document.getElementById(
  "refreshListBtn"
).onclick =
  loadRecordList;


document.getElementById(
  "registerTab"
).onclick =
  () =>
    setTab(
      "register"
    );


document.getElementById(
  "searchTab"
).onclick =
  () =>
    setTab(
      "search"
    );


document.getElementById(
  "listTab"
).onclick =
  () =>
    setTab(
      "list"
    );


document.getElementById(
  "cancelEditBtn"
).onclick =
async () => {

  await resetRegister();

  setTab(
    "register"
  );
};


document.getElementById(
  "workDate"
).value =
  localToday();


setRows(
  [],
  1
);


const {
  data: sessionData
} =
await supabase.auth
  .getSession();


if (
  sessionData.session
) {

  showApp();

} else {

  const {
    error
  } =
  await supabase.auth
    .signInAnonymously();


  if (
    error
  ) {

    loadingScreen.textContent =
      "자동 접속 실패: " +
      error.message;

  } else {

    showApp();
  }
}

</script>
