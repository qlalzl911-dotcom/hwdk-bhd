function localToday() {

  const d =
    new Date();

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );

  return `${y}-${m}-${day}`;
}


function formatDateTime(
  value
) {

  if (!value) {
    return "-";
  }

  const d =
    new Date(
      value
    );

  return d.toLocaleString(
    "ko-KR",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}


function safeFilename(
  value
) {

  return String(
    value || "BHD"
  ).replace(
    /[\\/:*?"<>|]/g,
    "_"
  );
}

/* =========================================
   결선표
========================================= */

function rowKey(
  section,
  position
) {

  return `${section}-${position}`;
}


function getRow(
  section,
  position
) {

  const key =
    rowKey(
      section,
      position
    );


  if (
    !rowMap.has(
      key
    )
  ) {

    rowMap.set(
      key,
      {
        section,
        position,
        left: "",
        right: "",
        confidence: 1,
        needs_review: false
      }
    );
  }


  return rowMap.get(
    key
  );
}


function setRows(
  rows = [],
  suppliedSections = 0
) {

  rowMap =
    new Map();


  let detectedSection =
    0;

  let detectedPosition =
    0;


  rows.forEach(
    raw => {

      const section =
        Number(
          raw.section ||
          1
        );


      const position =
        Number(
          raw.position ||
          1
        );


      detectedSection =
        Math.max(
          detectedSection,
          section
        );


      detectedPosition =
        Math.max(
          detectedPosition,
          position
        );


      rowMap.set(
        rowKey(
          section,
          position
        ),
        {
          section,
          position,
          left:
            raw.left ||
            "",
          right:
            raw.right ||
            "",
          confidence:
            Number(
              raw.confidence ??
              1
            ),
          needs_review:
            Boolean(
              raw.needs_review
            )
        }
      );
    }
  );


  sectionCount =
    Math.max(
      1,
      Number(
        suppliedSections ||
        0
      ),
      detectedSection
    );


  maxPosition =
    Math.max(
      1,
      detectedPosition
    );


  renderEditableMatrix();
}


function collectRows() {

  return [
    ...rowMap.values()
  ]
  .filter(
    row =>
      String(
        row.left ||
        ""
      ).trim() ||
      String(
        row.right ||
        ""
      ).trim()
  )
  .map(
    row => ({
      section:
        Number(
          row.section
        ),

      position:
        Number(
          row.position
        ),

      left:
        String(
          row.left ||
          ""
        ).trim(),

      right:
        String(
          row.right ||
          ""
        ).trim(),

      confidence:
        Number(
          row.confidence ??
          1
        ),

      needs_review:
        Boolean(
          row.needs_review
        )
    })
  )
  .sort(
    (a, b) =>
      a.section -
      b.section ||
      a.position -
      b.position
  );
}


function renderEditableMatrix() {

  const wrap =
    document.getElementById(
      "matrixWrap"
    );


  wrap.innerHTML =
    "";


  const table =
    document.createElement(
      "table"
    );


  const thead =
    document.createElement(
      "thead"
    );


  const head1 =
    document.createElement(
      "tr"
    );


  const positionHead =
    document.createElement(
      "th"
    );


  positionHead.textContent =
    "위치";

  positionHead.rowSpan =
    2;


  head1.appendChild(
    positionHead
  );


  for (
    let section = 1;
    section <= sectionCount;
    section++
  ) {

    const th =
      document.createElement(
        "th"
      );


    th.textContent =
      `구역 ${section}`;

    th.colSpan =
      2;

    th.className =
      "section-head";


    head1.appendChild(
      th
    );
  }


  const head2 =
    document.createElement(
      "tr"
    );


  for (
    let section = 1;
    section <= sectionCount;
    section++
  ) {

    const left =
      document.createElement(
        "th"
      );

    left.textContent =
      "좌";


    const right =
      document.createElement(
        "th"
      );

    right.textContent =
      "우";


    head2.appendChild(
      left
    );

    head2.appendChild(
      right
    );
  }


  thead.appendChild(
    head1
  );

  thead.appendChild(
    head2
  );

  table.appendChild(
    thead
  );


  const tbody =
    document.createElement(
      "tbody"
    );


  for (
    let position = 1;
    position <= maxPosition;
    position++
  ) {

    const tr =
      document.createElement(
        "tr"
      );


    const posTd =
      document.createElement(
        "td"
      );


    posTd.textContent =
      position;

    posTd.className =
      "position-cell";


    tr.appendChild(
      posTd
    );


    for (
      let section = 1;
      section <= sectionCount;
      section++
    ) {

      const row =
        getRow(
          section,
          position
        );


      [
        "left",
        "right"
      ].forEach(
        side => {

          const td =
            document.createElement(
              "td"
            );


          if (
            row.needs_review ||
            Number(
              row.confidence
            ) < 0.8
          ) {

            td.classList.add(
              "review-cell"
            );
          }


          const input =
            document.createElement(
              "input"
            );


          input.className =
            "matrix-input";

          input.value =
            row[side] ||
            "";

          input.placeholder =
            "-";


          input.addEventListener(
            "input",
            () => {

              row[side] =
                input.value;

              row.needs_review =
                false;

              row.confidence =
                1;


              td.classList.remove(
                "review-cell"
              );
            }
          );


          td.appendChild(
            input
          );

          tr.appendChild(
            td
          );
        }
      );
    }


    tbody.appendChild(
      tr
    );
  }


  table.appendChild(
    tbody
  );

  wrap.appendChild(
    table
  );
}

async function signedUrls(
  paths
) {

  const urls =
    [];


  for (
    const path of paths
  ) {

    const {
      data,
      error
    } =
    await supabase.storage
      .from(
        "bhd-images"
      )
      .createSignedUrl(
        path,
        3600
      );


    if (
      !error &&
      data?.signedUrl
    ) {

      urls.push(
        data.signedUrl
      );
    }
  }


  return urls;
}

async function downloadImage(
  url,
  filename
) {

  try {

    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {

      throw new Error();
    }


    const blob =
      await response.blob();


    const blobUrl =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      blobUrl;

    a.download =
      safeFilename(
        filename
      );


    document.body.appendChild(
      a
    );


    a.click();

    a.remove();


    setTimeout(
      () =>
        URL.revokeObjectURL(
          blobUrl
        ),
      1000
    );


  } catch (
    error
  ) {

    window.open(
      url,
      "_blank"
    );
  }
}

/* =========================================
   AI 분석
========================================= */

async function compressForAI(
  file,
  maxDimension = 1800,
  quality = 0.82
) {

  const bitmap =
    await createImageBitmap(
      file
    );


  const ratio =
    Math.min(
      1,
      maxDimension /
      Math.max(
        bitmap.width,
        bitmap.height
      )
    );


  const width =
    Math.round(
      bitmap.width *
      ratio
    );

  const height =
    Math.round(
      bitmap.height *
      ratio
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  canvas
    .getContext(
      "2d"
    )
    .drawImage(
      bitmap,
      0,
      0,
      width,
      height
    );


  bitmap.close();


  return canvas.toDataURL(
    "image/jpeg",
    quality
  );
}

   파일 업로드
========================================= */

function safePart(
  value
) {

  return value.replace(
    /[^a-zA-Z0-9가-힣_.-]/g,
    "_"
  );
}


async function uploadNewFiles(
  shipNo,
  name
) {

  const files =
    [
      ...photosInput.files
    ];


  const paths =
    [];


  const time =
    Date.now();


  for (
    let i = 0;
    i < files.length;
    i++
  ) {

    const file =
      files[i];


    const path =
      `${safePart(shipNo)}/` +
      `${safePart(name)}/` +
      `${time}-${i + 1}-` +
      `${safePart(file.name)}`;


    const {
      error
    } =
    await supabase.storage
      .from(
        "bhd-images"
      )
      .upload(
        path,
        file
      );


    if (
      error
    ) {

      throw error;
    }


    paths.push(
      path
    );
  }


  return paths;
}

/* =========================================
   후작업 반전표 HTML
========================================= */

function buildMirroredTableHTML(
  rows,
  sections
) {

  const map =
    new Map();


  let maxPos =
    1;


  rows.forEach(
    row => {

      const section =
        Number(
          row.section ||
          1
        );


      const position =
        Number(
          row.position ||
          1
        );


      maxPos =
        Math.max(
          maxPos,
          position
        );


      map.set(
        rowKey(
          section,
          position
        ),
        row
      );
    }
  );


  let html =
    `
      <table>
        <thead>
          <tr>
            <th rowspan="2">위치</th>
    `;


  for (
    let s = 1;
    s <= sections;
    s++
  ) {

    html +=
      `<th colspan="2">구역 ${s}</th>`;
  }


  html +=
    `
          </tr>
          <tr>
    `;


  for (
    let s = 1;
    s <= sections;
    s++
  ) {

    html +=
      `<th>좌</th><th>우</th>`;
  }


  html +=
    `
          </tr>
        </thead>
        <tbody>
    `;


  for (
    let p = 1;
    p <= maxPos;
    p++
  ) {

    html +=
      `
      <tr>
        <td class="position-cell">
          ${p}
        </td>
      `;


    for (
      let displaySection = 1;
      displaySection <= sections;
      displaySection++
    ) {

      const sourceSection =
        sections -
        displaySection +
        1;


      const source =
        map.get(
          rowKey(
            sourceSection,
            p
          )
        );


      html +=
        `<td>${escapeHtml(source?.right || "")}</td>` +
        `<td>${escapeHtml(source?.left || "")}</td>`;
    }


    html +=
      `</tr>`;
  }


  html +=
    `
        </tbody>
      </table>
    `;


  return html;
}


function renderMirroredMatrix(
  rows,
  sections
) {

  const wrap =
    document.getElementById(
      "resultMatrix"
    );


  wrap.innerHTML =
    buildMirroredTableHTML(
      rows,
      sections
    );
}

/* =========================================
   관리자 삭제
========================================= */

async function deleteRecord(
  record
) {

  if (
    !isAdmin
  ) {

    alert(
      "관리자만 삭제할 수 있습니다."
    );

    return;
  }


  const allowed =
    await checkCurrentUserAdmin();


  if (
    !allowed
  ) {

    alert(
      "관리자 인증이 확인되지 않았습니다."
    );

    return;
  }


  const ok =
    confirm(
      `${record.ship_no || ""} / ${record.bhd_no || ""}\n\n` +
      `이 기록을 정말 삭제하시겠습니까?\n` +
      `삭제 후에는 복구할 수 없습니다.`
    );


  if (!ok) {
    return;
  }


  try {

    const paths =
      Array.isArray(
        record.original_images
      ) &&
      record.original_images.length
        ? record.original_images
        : record.original_image
          ? [
              record.original_image
            ]
          : [];


    /*
     * 사진부터 삭제
     */
    if (
      paths.length
    ) {

      const {
        error: storageError
      } =
      await supabase.storage
        .from(
          "bhd-images"
        )
        .remove(
          paths
        );


      if (
        storageError
      ) {

        throw storageError;
      }
    }


    /*
     * DB 삭제
     */
    const {
      data: deletedRows,
      error: deleteError
    } =
    await supabase
      .from(
        "bhd_records"
      )
      .delete()
      .eq(
        "id",
        record.id
      )
      .select(
        "id"
      );


    if (
      deleteError
    ) {

      throw deleteError;
    }


    if (
      !deletedRows ||
      deletedRows.length === 0
    ) {

      throw new Error(
        "삭제 권한이 없거나 이미 삭제된 기록입니다."
      );
    }


    alert(
      "삭제되었습니다."
    );


    await loadRecordList();


  } catch (
    error
  ) {

    alert(
      "삭제 실패: " +
      (
        error?.message ||
        "오류"
      )
    );
  }
}

        / ${escapeHtml(record.area || "")}
        / ${escapeHtml(record.bhd_no || "")}
      </div>

      <span class="badge ${badgeClass}">
        ${statusText}
      </span>

    </div>

    <div class="record-meta">

      작업일:
      ${escapeHtml(record.work_date || "-")}
      <br>

      등록:
      ${formatDateTime(record.created_at)}

      ${
        record.is_completed &&
        record.completed_at
          ? `<br>후작업 완료: ${formatDateTime(record.completed_at)}`
          : ""
      }

    </div>
    `;


  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "record-actions";


  const view =
    document.createElement(
      "button"
    );


  view.className =
    "secondary";

  view.textContent =
    "후작업 보기";


  view.onclick =
    () =>
      showRecord(
        record
      );


  const edit =
    document.createElement(
      "button"
    );


  edit.className =
    "warning";

  edit.textContent =
    "수정";


  edit.onclick =
    () =>
      loadForEdit(
        record
      );


  actions.appendChild(
    view
  );


  actions.appendChild(
    edit
  );


  if (
    allowDelete &&
    isAdmin
  ) {

    const deleteBtn =
      document.createElement(
        "button"
      );


    deleteBtn.className =
      "delete-btn";

    deleteBtn.textContent =
      "삭제";


    deleteBtn.onclick =
      () =>
        deleteRecord(
          record
        );


    actions.appendChild(
      deleteBtn
    );
  }


  card.appendChild(
    actions
  );


  return card;
}


/* =========================================
   조회
========================================= */

async function searchRecords() {

  const ship =
    document.getElementById(
      "searchShip"
    ).value.trim();


  const area =
    document.getElementById(
      "searchArea"
    ).value.trim();


  const name =
    document.getElementById(
      "searchBhd"
    ).value.trim();


  const status =
    document.getElementById(
      "searchStatus"
    );


  const results =
    document.getElementById(
      "searchResults"
    );


  results.innerHTML =
    "";


  document.getElementById(
    "resultBox"
  ).classList.add(
    "hidden"
  );


  if (
    !ship &&
    !area &&
    !name
  ) {

    status.textContent =
      "호선, 위치, 이름 중 하나 이상 입력하세요.";

    return;
  }


  status.textContent =
    "검색 중...";


  let query =
    supabase
      .from(
        "bhd_records"
      )
      .select("*")
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


  if (
    ship
  ) {

    query =
      query.ilike(
        "ship_no",
        `%${ship}%`
      );
  }


  if (
    area
  ) {

    query =
      query.ilike(
        "area",
        `%${area}%`
      );
  }


  if (
    name
  ) {

    query =
      query.ilike(
        "bhd_no",
        `%${name}%`
      );
  }


  const {
    data,
    error
  } =
  await query;


  if (
    error
  ) {

    status.textContent =
      "조회 오류: " +
      error.message;

    return;
  }


  if (
    !data?.length
  ) {

    status.textContent =
      "조건에 맞는 등록 자료가 없습니다.";

    return;
  }


  const incompleteCount =
    data.filter(
      x =>
        !x.is_completed
    ).length;


  const completedCount =
    data.filter(
      x =>
        x.is_completed
    ).length;


  status.textContent =
    `${data.length}건 검색됨` +
    ` · 미완료 ${incompleteCount}건` +
    ` · 완료 ${completedCount}건`;


  data.forEach(
    record => {

      results.appendChild(
        recordCard(
          record,
          false
        )
      );
    }
  );
}


document.getElementById(
  "searchBtn"
).onclick =
  searchRecords;


[
  "searchShip",
  "searchArea",
  "searchBhd"
].forEach(
  id => {

    document
      .getElementById(
        id
      )
      .addEventListener(
        "keydown",
        e => {

          if (
            e.key === "Enter"
          ) {

            searchRecords();
          }
        }
      );
  }
);


/* =========================================
   목록
========================================= */

async function loadRecordList() {

  const container =
    document.getElementById(
      "recordList"
    );


  const status =
    document.getElementById(
      "listStatus"
    );


  container.innerHTML =
    "";


  status.textContent =
    "목록 불러오는 중...";


  const {
    data,
    error
  } =
  await supabase
    .from(
      "bhd_records"
    )
    .select("*")
    .order(
      "created_at",
      {
        ascending:
          false
      }
    );


  if (
    error
  ) {

    status.textContent =
      "목록 조회 실패: " +
      error.message;

    return;
  }


  if (
    !data?.length
  ) {

    status.textContent =
      "";


    container.innerHTML =
      `
      <div class="empty">
        등록된 BHD가 없습니다.
      </div>
      `;

    return;
  }


  const incompleteCount =
    data.filter(
      x =>
        !x.is_completed
    ).length;


  const completedCount =
    data.filter(
      x =>
        x.is_completed
    ).length;


  status.textContent =
    `전체 ${data.length}건` +
    ` · 미완료 ${incompleteCount}건` +
    ` · 완료 ${completedCount}건` +
    `${
      isAdmin
        ? " · 관리자 모드"
        : ""
    }`;


  data.forEach(
    record => {

      container.appendChild(
        recordCard(
          record,
          true
        )
      );
    }
  );
}


document.getElementById(
  "refreshListBtn"
).onclick =
  loadRecordList;


/* =========================================
   초기
========================================= */

document.getElementById(
  "workDate"
).value =
  localToday();


setRows(
  [],
  1
);


showEntry();

</script>
